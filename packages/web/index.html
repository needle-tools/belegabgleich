          },

            "@type": "Question",
            "name": "Werden meine Kontoauszüge oder Bankdaten hochgeladen?",
            "acceptedAnswer": { "@type": "Answer", "text": "Nein. Belegabgleich läuft zu 100 % lokal in deinem Browser. Deine Auszüge und Rechnungen verlassen den Rechner nicht — es gibt kein Backend und keine Cloud-KI." }

            "@type": "Question",

          },

            "@type": "Question",
            "name": "Was kostet Belegabgleich?",

<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Belegabgleich">
  <defs>
    <linearGradient id="kahGrad" x1="4" y1="6" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D7DB0A"/>
      <stop offset="1" stop-color="#62D399"/>
    </linearGradient>
  </defs>

  <!-- gradient app tile -->
  <rect x="1" y="1" width="46" height="46" rx="11" fill="url(#kahGrad)"/>

  <!-- the Beleg: a white document -->
  <rect x="11" y="9" width="20" height="28" rx="4" fill="#FFFFFF"/>
  <!-- ledger lines -->
  <g stroke="#C6D0C4" stroke-width="2" stroke-linecap="round">
    <line x1="15.5" y1="15" x2="26.5" y2="15"/>
    <line x1="15.5" y1="20" x2="26.5" y2="20"/>
    <line x1="15.5" y1="25" x2="22.5" y2="25"/>
  </g>

  <!-- gradient check badge, separated from the card by a white halo -->
  <circle cx="33" cy="33" r="10.5" fill="#FFFFFF"/>
  <circle cx="33" cy="33" r="8.5" fill="url(#kahGrad)"/>
  <path d="M28.8 33.2 L31.7 36.1 L37.4 29.6" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
